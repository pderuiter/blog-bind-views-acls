---
- name: Load distribution-specific BIND settings
  ansible.builtin.include_vars: "{{ ansible_facts['os_family'] }}.yml"

- name: Install BIND (Debian/Ubuntu)
  ansible.builtin.apt:
    name: "{{ bind_packages + bind_extra_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600
  when: ansible_facts['os_family'] == 'Debian'

- name: Install BIND (RHEL)
  ansible.builtin.dnf:
    name: "{{ bind_packages + bind_extra_packages }}"
    state: present
  when: ansible_facts['os_family'] == 'RedHat'

- name: Create the key directory
  ansible.builtin.file:
    path: "{{ bind_keys_dir }}"
    state: directory
    owner: root
    group: "{{ bind_group }}"
    mode: "0750"

- name: Write the main named.conf
  ansible.builtin.template:
    src: "named.conf.{{ ansible_facts['os_family'] }}.j2"
    dest: "{{ bind_main_conf }}"
    owner: root
    group: "{{ bind_group }}"
    mode: "0640"
  notify: Bind config changed

- name: Enable named
  ansible.builtin.service:
    name: "{{ bind_service }}"
    enabled: true
